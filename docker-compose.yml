version: '3.8'

services:
  # Servicio 1: La Base de Datos (Cerebro)
  db:
    image: postgres:15
    container_name: mi_postgres_db
    restart: always
    environment:
      POSTGRES_USER: usuario_medico # Tu usuario
      POSTGRES_PASSWORD: password123 # Tu contraseña (cámbiala si quieres)
      POSTGRES_DB: simr_db # Nombre de tu base de datos
    ports:
      - "5432:5432" # Expone el puerto para que tu FastAPI local pueda conectarse
    volumes:
      - postgres_data:/var/lib/postgresql/data # Para que los datos no se borren al apagar docker

  # Servicio 2: pgAdmin (Monitor/Visor)
  pgadmin:
    image: dpage/pgadmin4
    container_name: mi_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@neurologia.com # Usuario para entrar a pgAdmin
      PGADMIN_DEFAULT_PASSWORD: admin # Contraseña para entrar a pgAdmin
    ports:
      - "5050:80" # Entrarás por http://localhost:5050
    depends_on:
      - db

volumes:
  postgres_data:
